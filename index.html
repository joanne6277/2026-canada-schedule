<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 加拿大之旅 行程與打包清單</title>
<meta name="description" content="2026 加拿大家族之旅的行程與行李打包清單，可以直接在手機上查看和勾選。">
<meta name="theme-color" content="#1f3864">

<!-- 貼到 LINE 或 Facebook 時顯示的預覽資訊 -->
<meta property="og:type" content="website">
<meta property="og:title" content="2026 加拿大之旅 行程與打包清單">
<meta property="og:description" content="每天的行程、住宿、交通都在這裡；打包清單勾到哪裡會自動記住。">
<meta property="og:locale" content="zh_TW">

<!-- 更新內容後，把下面三個 v=2 改成 v=3、v=4…，家人才會看到最新版 -->
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<!-- 內容全部由 content.js 提供，版面由 app.js 產生 -->
<header id="pageHeader"></header>

<!-- 分頁按鈕 -->
<div class="tabs" id="tabs" role="tablist" aria-label="頁面分頁">
  <button type="button" role="tab" id="tab-itinerary" aria-controls="panel-itinerary" aria-selected="false">行程</button>
  <button type="button" role="tab" id="tab-packing" aria-controls="panel-packing" aria-selected="false">打包清單</button>
</div>

<!-- 行程分頁 -->
<div id="panel-itinerary" role="tabpanel" aria-labelledby="tab-itinerary" hidden>
  <div class="wrap panel-wrap">
    <div id="itin"></div>
  </div>
</div>

<!-- 打包清單分頁 -->
<div id="panel-packing" role="tabpanel" aria-labelledby="tab-packing" hidden>
  <div class="progress">
    <div id="ptext">打包進度</div>
    <div class="bar"><span id="pbar"></span></div>
  </div>

  <div class="wrap panel-wrap">
    <div id="notice"></div>
    <nav id="nav"></nav>
    <main id="main"></main>
    <button class="reset" id="resetBtn">清除全部勾選，重新開始</button>
  </div>
</div>

<div class="wrap">
  <p class="foot" id="foot"></p>
</div>

<button class="top" id="topBtn">回到最上面</button>

<script src="content.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
