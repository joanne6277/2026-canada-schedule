<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 加拿大之旅 行程與團費明細</title>
<meta name="description" content="2026 加拿大家族之旅的行程紀錄與費用結算。">
<meta name="theme-color" content="#1f3864">

<!-- 貼到 LINE 或 Facebook 時顯示的預覽資訊 -->
<meta property="og:type" content="website">
<meta property="og:title" content="2026 加拿大之旅 行程與團費明細">
<meta property="og:description" content="每天實際走過的行程、住宿、交通，以及每人團費明細。">
<meta property="og:locale" content="zh_TW">

<!-- 更新內容後，把下面三個 v=2 改成 v=3、v=4…，家人才會看到最新版 -->
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body>

<!-- 內容全部由 content.js 提供，版面由 app.js 產生 -->
<header id="pageHeader"></header>

<!-- 分頁按鈕 -->
<div class="tabs" id="tabs" role="tablist" aria-label="頁面分頁">
  <button type="button" role="tab" id="tab-itinerary" aria-controls="panel-itinerary" aria-selected="false">行程</button>
  <button type="button" role="tab" id="tab-settlement" aria-controls="panel-settlement" aria-selected="false">團費明細</button>
</div>

<!-- 行程分頁 -->
<div id="panel-itinerary" role="tabpanel" aria-labelledby="tab-itinerary" hidden>
  <div class="wrap panel-wrap">
    <div id="itin"></div>
  </div>
</div>

<!-- 團費明細分頁 -->
<div id="panel-settlement" role="tabpanel" aria-labelledby="tab-settlement" hidden>
  <div class="wrap panel-wrap">
    <div id="settle"></div>
  </div>
</div>

<div class="wrap">
  <p class="foot" id="foot"></p>
</div>

<button class="top" id="topBtn">回到最上面</button>

<script src="content.js?v=11"></script>
<script src="app.js?v=11"></script>
</body>
</html>
